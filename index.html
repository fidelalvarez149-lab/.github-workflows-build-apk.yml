<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}.nameform{display:flex;flex-direction:column;gap:6px;margin-top:8px}.warn{background:var(--debt-bg);color:var(--debt);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem}textarea{width:100%;font:500 .8rem ui-monospace,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}</style>
<title>Finanza y Deudas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: una sola columna tipo app de bolsillo, con pestañas Hoy / Historial / Deudas. */
:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --fg: #14211B;
  --muted: #5C6B63;
  --line: #D9E1DB;
  --accent: #0E6B4F;
  --accent-fg: #FFFFFF;
  --saved: #A86A0B;
  --saved-bg: #FBF0DC;
  --debt: #B1362B;
  --debt-bg: #FBE7E4;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1713; --surface: #18231D; --fg: #E8F0EA; --muted: #9AAEA2; --line: #2A3A31;
    --accent: #4CC59A; --accent-fg: #07241A; --saved: #E8B35A; --saved-bg: #2F2512;
    --debt: #F08A7E; --debt-bg: #381A17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1713; --surface: #18231D; --fg: #E8F0EA; --muted: #9AAEA2; --line: #2A3A31;
  --accent: #4CC59A; --accent-fg: #07241A; --saved: #E8B35A; --saved-bg: #2F2512;
  --debt: #F08A7E; --debt-bg: #381A17; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, .num { font-family: var(--font-display); }
h1 { font-size: 1.5rem; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; margin: 0; }
.sub { color: var(--muted); font-size: .875rem; margin: 4px 0 0; }
.label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--line); padding: 4px; border-radius: 12px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 600 .9rem var(--font-body); padding: 10px 6px; border-radius: 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input[type="number"], input[type="date"], input[type="text"] {
  width: 100%; font: 500 1rem var(--font-body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0;
}
input.big { font: 700 1.9rem var(--font-display); padding: 12px 14px; font-variant-numeric: tabular-nums; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); font: 700 1.05rem var(--font-display); padding: 12px; border-radius: 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.btn { border: 0; background: var(--accent); color: var(--accent-fg); font: 700 1rem var(--font-body); padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.small { width: auto; padding: 10px 14px; font-size: .9rem; }
.link { background: none; border: 0; color: var(--muted); font: 600 .85rem var(--font-body); padding: 8px 4px; cursor: pointer; text-decoration: underline; }
.link.danger { color: var(--debt); }

.split { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.split > div { background: var(--bg); border-radius: 10px; padding: 10px; min-width: 0; }
.split .num { font-size: 1.1rem; display: block; overflow-wrap: anywhere; }
.split .saved .num { color: var(--saved); }
.split .left .num { color: var(--accent); }

.month { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.month > div { background: var(--bg); border-radius: 10px; padding: 12px; min-width: 0; }
.month .num { font-size: 1.25rem; display: block; overflow-wrap: anywhere; }
.month .wide { grid-column: 1 / -1; background: var(--accent); color: var(--accent-fg); }
.month .wide .label { color: inherit; opacity: .8; }
.month .wide .num { font-size: 1.9rem; }
.month .saved .num { color: var(--saved); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 44px; height: 44px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; }
.nav strong { font-family: var(--font-display); text-transform: capitalize; text-align: center; }

.list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .d { font-weight: 600; text-transform: capitalize; }
.row .meta { color: var(--muted); font-size: .85rem; }
.row .amt { text-align: right; }
.row .amt .num { font-size: 1.1rem; }
.row .actions { grid-column: 1 / -1; display: flex; gap: 4px; }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--saved-bg); color: var(--saved); }
.pill.debt { background: var(--debt-bg); color: var(--debt); }
.pill.ok { background: var(--bg); color: var(--accent); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; grid-column: 1 / -1; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.more, .pay { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .95rem; }
.toast { min-height: 1.3em; font-size: .9rem; font-weight: 600; color: var(--accent); }
.foot { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="app-title">Finanza y Deudas</h1>
    <p class="sub" id="today-label"></p>
    <button class="link" id="name-btn" data-action="name-open" style="padding-left:0"></button>
    <form id="name-form" class="nameform" hidden>
      <label class="label" for="in-name">Tu nombre</label>
      <div class="pay"><input id="in-name" type="text" maxlength="30" autocomplete="off" placeholder="Escribe tu nombre"><button class="btn small" type="submit">Guardar</button></div>
    </form>
  </header>
  <div class="warn" id="warn" role="alert" hidden>No se pudo guardar en este navegador (modo privado o sin espacio). Tus datos se perderán al cerrar. Usa Respaldo de datos para copiarlos.</div>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="hoy" aria-selected="true">Hoy</button>
    <button role="tab" data-tab="historial" aria-selected="false">Historial</button>
    <button role="tab" data-tab="deudas" aria-selected="false">Deudas</button>
  </div>

  <main id="view"></main>

  <div class="foot"><button class="link" data-action="bk-toggle">Respaldo de datos</button></div>
  <section class="panel" id="bk-panel" hidden>
    <h2>Respaldo de datos</h2>
    <p class="sub">Copia este texto y guárdalo en tus notas o en WhatsApp. Para restaurar, pégalo aquí y toca Restaurar.</p>
    <textarea id="bk-text" rows="6" aria-label="Texto del respaldo"></textarea>
    <button class="btn ghost" data-action="bk-copy">Copiar respaldo</button>
    <button class="btn" data-action="bk-restore">Restaurar desde el texto</button>
    <div class="toast" id="bk-msg" role="status"></div>
  </section>
</div>

<script>
(function () {
  var KEY = "finanza-deudas-gregory-v1";
  var MAX = 1e9;
  var nf = new Intl.NumberFormat("es-NI", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  var state = { name: "", entries: [], debts: [] };
  var ui = { tab: "hoy", month: ym(new Date()), date: ymd(new Date()), pct: 10, amount: "", toast: "", confirm: null, more: null };
  var downloads = null;

  function pad(n) { return String(n).padStart(2, "0"); }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function ym(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function parseDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2] || 1); }
  function money(n) { return "C$ " + nf.format(round2(n)); }
  function round2(n) { return Math.round((+n + Number.EPSILON) * 100) / 100; }
  function saved(e) { return round2(e.amount * e.pct / 100); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function monthName(m) { return parseDate(m + "-01").toLocaleDateString("es-NI", { month: "long", year: "numeric" }); }
  function dayName(s) { return parseDate(s).toLocaleDateString("es-NI", { weekday: "long", day: "numeric", month: "short" }); }
  function shiftMonth(m, delta) { var d = parseDate(m + "-01"); d.setMonth(d.getMonth() + delta); return ym(d); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function clean(s) {
    if (!s || !Array.isArray(s.entries) || !Array.isArray(s.debts)) return null;
    var out = { name: (typeof s.name === "string" ? s.name.trim().slice(0, 30) : ""), entries: [], debts: [] }, seenDates = {}, seenIds = {};
    s.entries.forEach(function (e) {
      if (!e || typeof e.date !== "string" || !DATE_RE.test(e.date) || seenDates[e.date]) return;
      var a = Number(e.amount); if (!isFinite(a) || a <= 0 || a > MAX) return;
      seenDates[e.date] = 1;
      out.entries.push({ date: e.date, amount: round2(a), pct: Number(e.pct) === 20 ? 20 : 10 });
    });
    s.debts.forEach(function (d) {
      if (!d) return;
      var t = Number(d.total); if (!isFinite(t) || t <= 0 || t > MAX) return;
      var id = (typeof d.id === "string" && /^[a-z0-9]{1,24}$/i.test(d.id) && !seenIds[d.id]) ? d.id : uid();
      seenIds[id] = 1;
      var pays = Array.isArray(d.payments) ? d.payments.filter(function (p) { return p && isFinite(Number(p.amount)) && Number(p.amount) > 0; })
        .map(function (p) { return { date: (typeof p.date === "string" && DATE_RE.test(p.date)) ? p.date : "", amount: round2(Number(p.amount)) }; }) : [];
      var extras = Array.isArray(d.extras) ? d.extras.filter(function (x) { return x && isFinite(Number(x.amount)) && Number(x.amount) > 0 && Number(x.amount) <= MAX; })
        .map(function (x) { return { date: (typeof x.date === "string" && DATE_RE.test(x.date)) ? x.date : "", amount: round2(Number(x.amount)) }; }) : [];
      out.debts.push({ id: id, extras: extras, who: String(d.who == null ? "" : d.who).slice(0, 60) || "Sin nombre", total: round2(t), due: (typeof d.due === "string" && DATE_RE.test(d.due)) ? d.due : "", payments: pays });
    });
    return out;
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (!raw) return;
    var s = null;
    try { s = clean(JSON.parse(raw)); } catch (e) {}
    if (s) state = s;
    else { try { localStorage.setItem(KEY + "-corrupto", raw); } catch (e) {} }
  }
  function persist() {
    var ok = true;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { ok = false; }
    var w = document.getElementById("warn"); if (w) w.hidden = ok;
    return ok;
  }
  function probe() {
    var ok = true;
    try { localStorage.setItem(KEY + "-t", "1"); localStorage.removeItem(KEY + "-t"); } catch (e) { ok = false; }
    var w = document.getElementById("warn"); if (w) w.hidden = ok;
  }

  function summary(m) {
    var list = state.entries.filter(function (e) { return e.date.slice(0, 7) === m; });
    var earned = 0, sv = 0;
    list.forEach(function (e) { earned += e.amount; sv += saved(e); });
    return { list: list, earned: round2(earned), saved: round2(sv), left: round2(earned - sv), days: list.length, avg: list.length ? round2(earned / list.length) : 0 };
  }
  function allSaved() { var t = 0; state.entries.forEach(function (e) { t += saved(e); }); return round2(t); }
  function owe(d) { var t = d.total; (d.extras || []).forEach(function (x) { t += x.amount; }); return round2(t); }
  function added(d) { var t = 0; (d.extras || []).forEach(function (x) { t += x.amount; }); return round2(t); }
  function paid(d) { var t = 0; d.payments.forEach(function (p) { t += p.amount; }); return round2(t); }

  function monthCards(m) {
    var s = summary(m);
    return '<div class="month">' +
      '<div class="wide"><span class="label">Ganado en el mes</span><span class="num">' + money(s.earned) + '</span></div>' +
      '<div class="saved"><span class="label">Apartado</span><span class="num">' + money(s.saved) + '</span></div>' +
      '<div><span class="label">Te quedó</span><span class="num">' + money(s.left) + '</span></div>' +
      '<div><span class="label">Días trabajados</span><span class="num">' + s.days + '</span></div>' +
      '<div><span class="label">Promedio por día</span><span class="num">' + money(s.avg) + '</span></div>' +
      '</div>';
  }

  function viewHoy() {
    var amt = parseFloat(ui.amount);
    var valid = isFinite(amt) && amt > 0;
    var ap = valid ? round2(amt * ui.pct / 100) : 0;
    var exists = state.entries.some(function (e) { return e.date === ui.date; });
    return '<section class="panel">' +
      '<div class="field"><label class="label" for="in-amount">¿Cuánto gané hoy? (C$)</label>' +
      '<input id="in-amount" class="big" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="' + esc(ui.amount) + '"></div>' +
      '<div class="field"><span class="label">Apartar para el fondo</span>' +
      '<div class="seg"><button data-pct="10" aria-pressed="' + (ui.pct === 10) + '">10%</button><button data-pct="20" aria-pressed="' + (ui.pct === 20) + '">20%</button></div></div>' +
      '<div class="split"><div><span class="label">Gané</span><span class="num" id="p-earn">' + money(valid ? amt : 0) + '</span></div>' +
      '<div class="saved"><span class="label">Aparto</span><span class="num" id="p-save">' + money(ap) + '</span></div>' +
      '<div class="left"><span class="label">Me queda</span><span class="num" id="p-left">' + money(valid ? amt - ap : 0) + '</span></div></div>' +
      '<div class="field"><label class="label" for="in-date">Fecha</label><input id="in-date" type="date" value="' + esc(ui.date) + '"></div>' +
      '<button class="btn" data-action="save-day" id="btn-save">' + (exists ? "Actualizar este día" : "Guardar el día") + '</button>' +
      '<div class="toast" id="toast" role="status">' + esc(ui.toast) + '</div>' +
      '</section>' +
      '<section class="panel"><h2>' + esc(monthName(ym(new Date()))) + '</h2>' + monthCards(ym(new Date())) +
      '<div class="meta sub">Fondo apartado en total: <strong class="num">' + money(allSaved()) + '</strong></div></section>';
  }

  function viewHistorial() {
    var s = summary(ui.month);
    var rows = s.list.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (e) {
      var c = ui.confirm === "e" + e.date;
      return '<li class="row"><div><div class="d">' + esc(dayName(e.date)) + '</div>' +
        '<div class="meta">Apartaste ' + money(saved(e)) + ' <span class="pill">' + e.pct + '%</span></div></div>' +
        '<div class="amt"><span class="num">' + money(e.amount) + '</span><div class="meta">quedó ' + money(e.amount - saved(e)) + '</div></div>' +
        '<div class="actions"><button class="link" data-action="edit-day" data-date="' + e.date + '">Editar</button>' +
        '<button class="link danger" data-action="del-day" data-date="' + e.date + '">' + (c ? "¿Seguro? Toca otra vez" : "Borrar") + '</button></div></li>';
    }).join("");
    return '<section class="panel"><div class="nav"><button data-action="prev" aria-label="Mes anterior">&#8592;</button><strong>' + esc(monthName(ui.month)) + '</strong>' +
      '<button data-action="next" aria-label="Mes siguiente">&#8594;</button></div>' + monthCards(ui.month) + '</section>' +
      '<section class="panel"><h2>Días registrados</h2>' +
      (rows ? '<ul class="list">' + rows + '</ul>' : '<div class="empty">No hay días guardados en este mes. Anota lo que ganaste en la pestaña Hoy.</div>') + '</section>';
  }

  function viewDeudas() {
    var owed = 0;
    state.debts.forEach(function (d) { owed += Math.max(0, owe(d) - paid(d)); });
    var rows = state.debts.map(function (d) {
      var p = paid(d), tot = owe(d), left = round2(Math.max(0, tot - p)), pct = tot ? Math.min(100, Math.round(p / tot * 100)) : 0, ad = added(d);
      var c = ui.confirm === "d" + d.id;
      var due = d.due ? '<span class="meta"> · vence ' + esc(parseDate(d.due).toLocaleDateString("es-NI", { day: "numeric", month: "short", year: "numeric" })) + '</span>' : "";
      var late = d.due && left > 0 && d.due < ymd(new Date());
      return '<li class="row"><div><div class="d" style="text-transform:none">' + esc(d.who) + '</div>' +
        '<div class="meta">Debes ' + money(tot) + ' · pagado ' + money(p) + (ad ? ' · agregado ' + money(ad) : "") + due + '</div></div>' +
        '<div class="amt"><span class="num">' + money(left) + '</span><div>' +
        (left === 0 ? '<span class="pill ok">Pagada</span>' : late ? '<span class="pill debt">Vencida</span>' : '<span class="pill debt">Pendiente</span>') + '</div></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        (left > 0 ? '<form class="pay" data-id="' + d.id + '"><input type="number" inputmode="decimal" min="0" step="any" placeholder="Abono en C$" aria-label="Abono para ' + esc(d.who) + '"><button class="btn small" type="submit">Abonar</button></form>' : '') +
        (ui.more === d.id
          ? '<form class="more" data-id="' + d.id + '"><input type="number" inputmode="decimal" min="0" step="any" placeholder="Monto a sumar en C$" aria-label="Monto a sumar a la deuda de ' + esc(d.who) + '" autofocus><button class="btn small" type="submit">Sumar</button></form>'
          : '') +
        '<div class="actions"><button class="link" data-action="more-open" data-id="' + d.id + '">' + (ui.more === d.id ? "Cancelar" : "+ Agregar más a esta deuda") + '</button>' +
        '<button class="link danger" data-action="del-debt" data-id="' + d.id + '">' + (c ? "¿Seguro? Toca otra vez" : "Borrar deuda") + '</button></div></li>';
    }).join("");
    return '<section class="panel"><div><span class="label">Total que debo</span><div class="num" style="font-size:1.9rem;color:var(--debt)">' + money(owed) + '</div></div>' +
      (rows ? '<ul class="list">' + rows + '</ul>' : '<div class="empty">Todavía no hay deudas registradas.</div>') + '</section>' +
      '<section class="panel"><h2>Agregar deuda</h2>' +
      '<form id="debt-form" class="panel" style="border:0;padding:0">' +
      '<div class="field"><label class="label" for="d-who">A quién le debo</label><input id="d-who" type="text" maxlength="60" placeholder="Ej: Tienda, amigo, banco" required></div>' +
      '<div class="field"><label class="label" for="d-total">Monto (C$)</label><input id="d-total" type="number" inputmode="decimal" min="0.01" step="any" required></div>' +
      '<div class="field"><label class="label" for="d-due">Fecha límite (opcional)</label><input id="d-due" type="date"></div>' +
      '<button class="btn" type="submit">Guardar deuda</button></form></section>';
  }

  function renderName() {
    var n = state.name || "";
    document.getElementById("app-title").textContent = n ? "Finanza y Deudas de " + n : "Finanza y Deudas";
    document.title = n ? "Finanza y Deudas de " + n : "Finanza y Deudas";
    document.getElementById("name-btn").textContent = n ? "Cambiar nombre" : "Poner mi nombre";
  }
  function render() {
    renderName();
    document.getElementById("today-label").textContent = new Date().toLocaleDateString("es-NI", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    var v = document.getElementById("view");
    v.innerHTML = ui.tab === "hoy" ? viewHoy() : ui.tab === "historial" ? viewHistorial() : viewDeudas();
    document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)); });
  }

  function updatePreview() {
    var amt = parseFloat(ui.amount), valid = isFinite(amt) && amt > 0, ap = valid ? round2(amt * ui.pct / 100) : 0;
    document.getElementById("p-earn").textContent = money(valid ? amt : 0);
    document.getElementById("p-save").textContent = money(ap);
    document.getElementById("p-left").textContent = money(valid ? amt - ap : 0);
  }
  function armConfirm(btn, key, original) {
    var prev = armConfirm.btn;
    if (prev && prev !== btn && prev.isConnected) prev.textContent = armConfirm.orig;
    armConfirm.btn = btn; armConfirm.orig = original; ui.confirm = key;
    btn.textContent = "¿Seguro? Toca otra vez";
    clearTimeout(armConfirm.t);
    armConfirm.t = setTimeout(function () { if (ui.confirm === key) { ui.confirm = null; if (btn.isConnected) btn.textContent = original; } }, 3500);
  }

  function saveDay() {
    var amt = parseFloat(ui.amount);
    if (!isFinite(amt) || amt <= 0) { ui.toast = "Escribe cuánto ganaste."; render(); return; }
    if (amt > MAX) { ui.toast = "Ese monto es demasiado grande."; render(); return; }
    if (!ui.date) { ui.toast = "Elige una fecha."; render(); return; }
    amt = round2(amt);
    var existing = state.entries.filter(function (e) { return e.date === ui.date; })[0];
    if (existing) { existing.amount = amt; existing.pct = ui.pct; } else { state.entries.push({ date: ui.date, amount: amt, pct: ui.pct }); }
    var okSave = persist();
    ui.toast = (!okSave ? "No se pudo guardar. " : existing ? "Día actualizado. " : "Día guardado. ") + "Apartaste " + money(round2(amt * ui.pct / 100)) + " y te quedan " + money(amt - round2(amt * ui.pct / 100)) + ".";
    ui.amount = ""; ui.date = ymd(new Date());
    render();
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.tab) { ui.tab = t.dataset.tab; ui.toast = ""; ui.confirm = null; render(); return; }
    if (t.dataset.pct) { ui.pct = +t.dataset.pct; document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.pct === ui.pct)); }); updatePreview(); return; }
    var a = t.dataset.action; if (!a) return;
    if (a === "save-day") saveDay();
    else if (a === "prev") { ui.month = shiftMonth(ui.month, -1); render(); }
    else if (a === "next") { ui.month = shiftMonth(ui.month, 1); render(); }
    else if (a === "edit-day") {
      var e = state.entries.filter(function (x) { return x.date === t.dataset.date; })[0];
      if (e) { ui.tab = "hoy"; ui.date = e.date; ui.amount = String(e.amount); ui.pct = e.pct === 20 ? 20 : 10; ui.toast = "Cambia el monto y toca Actualizar."; render(); window.scrollTo(0, 0); }
    }
    else if (a === "del-day") {
      var k = "e" + t.dataset.date;
      if (ui.confirm === k) { state.entries = state.entries.filter(function (x) { return x.date !== t.dataset.date; }); persist(); ui.confirm = null; render(); }
      else armConfirm(t, k, "Borrar");
    }
    else if (a === "more-open") {
      ui.more = ui.more === t.dataset.id ? null : t.dataset.id; render();
      if (ui.more) { var mi = document.querySelector("#view .more input"); if (mi) mi.focus(); }
    }
    else if (a === "del-debt") {
      var kd = "d" + t.dataset.id;
      if (ui.confirm === kd) { state.debts = state.debts.filter(function (x) { return x.id !== t.dataset.id; }); persist(); ui.confirm = null; render(); }
      else armConfirm(t, kd, "Borrar deuda");
    }
    else if (a === "name-open") {
      var f = document.getElementById("name-form"); f.hidden = !f.hidden;
      if (!f.hidden) { var i = document.getElementById("in-name"); i.value = state.name || ""; i.focus(); }
    }
    else if (a === "bk-toggle") bkToggle();
    else if (a === "bk-copy") bkCopy();
    else if (a === "bk-restore") bkRestore();
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.id === "in-amount") { ui.amount = ev.target.value; updatePreview(); }
    else if (ev.target.id === "in-date") { ui.date = ev.target.value; var ex = state.entries.some(function (e) { return e.date === ui.date; }); var b = document.getElementById("btn-save"); if (b) b.textContent = ex ? "Actualizar este día" : "Guardar el día"; }
  });

  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.id === "name-form") {
      state.name = document.getElementById("in-name").value.trim().slice(0, 30);
      persist(); f.hidden = true; renderName();
    } else if (f.id === "debt-form") {
      var who = document.getElementById("d-who").value.trim(), total = parseFloat(document.getElementById("d-total").value), due = document.getElementById("d-due").value;
      if (!who || !isFinite(total) || total <= 0 || total > MAX) return;
      state.debts.push({ id: uid(), extras: [], who: who, total: round2(total), due: due || "", payments: [] });
      persist(); render();
    } else if (f.classList.contains("more")) {
      var vi = parseFloat(f.querySelector("input").value);
      if (!isFinite(vi) || vi <= 0) return;
      var dm = state.debts.filter(function (x) { return x.id === f.dataset.id; })[0];
      if (dm) {
        if (owe(dm) + vi > MAX) return;
        if (!Array.isArray(dm.extras)) dm.extras = [];
        dm.extras.push({ date: ymd(new Date()), amount: round2(vi) }); ui.more = null; persist(); render();
      }
    } else if (f.classList.contains("pay")) {
      var inp = f.querySelector("input"), v = parseFloat(inp.value);
      if (!isFinite(v) || v <= 0) return;
      var d = state.debts.filter(function (x) { return x.id === f.dataset.id; })[0];
      if (d) { var rest = round2(owe(d) - paid(d)); if (rest <= 0) return; d.payments.push({ date: ymd(new Date()), amount: Math.min(round2(v), rest) }); persist(); render(); }
    }
  });

  function bkMsg(t) { document.getElementById("bk-msg").textContent = t; }
  function bkToggle() {
    var p = document.getElementById("bk-panel"); p.hidden = !p.hidden;
    if (!p.hidden) { document.getElementById("bk-text").value = JSON.stringify(state); bkMsg(""); p.scrollIntoView({ block: "nearest" }); }
  }
  function bkCopy() {
    var ta = document.getElementById("bk-text"); ta.value = JSON.stringify(state); ta.select();
    var ok = function () { bkMsg("Respaldo copiado. Pégalo en tus notas."); };
    var manual = function () { bkMsg("Mantén presionado el texto y elige Copiar."); };
    var legacy = function () { try { document.execCommand("copy") ? ok() : manual(); } catch (e) { manual(); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok).catch(legacy); else legacy();
  }
  var bkArmed = false;
  function bkRestore() {
    var s = null;
    try { s = clean(JSON.parse(document.getElementById("bk-text").value)); } catch (e) {}
    if (!s) { bkArmed = false; bkMsg("Ese texto no es un respaldo de la app."); return; }
    if (!bkArmed) {
      bkArmed = true; bkMsg("Esto reemplaza todos tus datos actuales. Toca Restaurar otra vez para confirmar.");
      clearTimeout(bkRestore.t); bkRestore.t = setTimeout(function () { bkArmed = false; }, 6000); return;
    }
    bkArmed = false; state = s; persist(); render(); bkMsg("Respaldo restaurado.");
  }

  load(); render(); probe();

  window.addEventListener("storage", function (ev) {
    if (ev.key !== KEY || !ev.newValue) return;
    try { var s = clean(JSON.parse(ev.newValue)); if (s) { state = s; render(); } } catch (e) {}
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    document.getElementById("today-label").textContent = new Date().toLocaleDateString("es-NI", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    if (ui.tab === "hoy" && !ui.amount && ui.date !== ymd(new Date())) { ui.date = ymd(new Date()); ui.toast = ""; render(); }
  });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
